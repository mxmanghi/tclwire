<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>TclWire multipart form POST</title>
</head>
<body>
  <form
    action="http://tclwire.rivetweb.org:8990/"
    method="post"
    enctype="multipart/form-data"
  >
    <input type="hidden" name="text_entry" value="TCLCURL">
    <input type="hidden" name="option_selected" value="opt1">
    <input type="hidden" name="result_limit" value="25">
    <button type="submit" name="submit" value="Search">Search</button>
  </form>
</body>
</html>
